<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0D1B40">
<title>Testimonials | Vinayak ProEdu Admin</title>
<link rel="icon" type="image/png" href="https://pasteimg.com/images/2026/03/31/WhatsApp-Image-2026-03-19-at-6.49.19-PM.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B40; --navy-mid:#1a2e5e; --blue:#1e3c72; --gold:#C9922A; --gold-lt:#E8AA48;
  --ink:#1A1A2E; --muted:#6B7280; --white:#FFFFFF;
  --shadow-sm:0 4px 20px rgba(13,27,64,0.08); --shadow-md:0 12px 45px rgba(13,27,64,0.14);
  --r-sm:10px; --r-md:16px; --r-lg:24px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:#f5f7fb;line-height:1.65;overflow-x:hidden;}
h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.2;}
.hidden{display:none !important;}
button{font-family:inherit;}

/* Login */
.login-wrap{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:min(420px,92vw);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-lg);padding:clamp(32px,6vw,48px);backdrop-filter:blur(20px);box-shadow:0 40px 100px rgba(0,0,0,0.4);}
.login-box h2{font-family:'Playfair Display',serif;color:#fff;font-size:1.6rem;margin-bottom:6px;text-align:center;}
.login-box p{color:rgba(255,255,255,0.55);font-size:0.9rem;text-align:center;margin-bottom:28px;}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-field label{font-size:0.74rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.65);}
.login-field input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.14);border-radius:var(--r-sm);color:#fff;font-size:0.95em;font-family:'DM Sans',sans-serif;transition:all 0.25s;}
.login-field input::placeholder{color:rgba(255,255,255,0.32);}
.login-field input:focus{outline:none;border-color:rgba(201,146,42,0.6);background:rgba(255,255,255,0.13);box-shadow:0 0 0 3px rgba(201,146,42,0.15);}
.login-btn{width:100%;padding:15px;border-radius:50px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:var(--navy);font-size:1em;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 8px 28px rgba(201,146,42,0.35);transition:all 0.3s;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(201,146,42,0.5);}
.login-status{margin-top:12px;font-size:0.9rem;font-weight:700;text-align:center;min-height:22px;color:#fca5a5;}

/* Shell */
.app-main{padding:24px 28px;max-width:1200px;margin:0 auto;min-height:100vh;}
.app-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e5e7eb;}
.app-title{font-family:'Playfair Display',serif;color:var(--navy);font-size:1.6rem;margin:0;}
.app-sub{color:var(--muted);font-size:0.9rem;}

.app-grid-2{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start;}
@media(max-width:900px){.app-grid-2{grid-template-columns:1fr;}}

.app-card{background:#fff;border:1px solid rgba(201,146,42,0.12);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.subject-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--navy);margin:0 0 14px;}

.portal-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.portal-field label{font-size:0.74rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.portal-field input,.portal-field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(13,27,64,0.14);background:#fff;color:var(--ink);font-size:0.95rem;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
.portal-field textarea{min-height:110px;resize:vertical;}
.portal-field input:focus,.portal-field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,146,42,0.12);}

.primary-btn,.ghost-btn,.danger-btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.9rem;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.primary-btn{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;}
.ghost-btn{background:#eef4ff;color:var(--blue);}
.danger-btn{background:#fef2f2;color:#b42318;border:1px solid #fecaca;}
.primary-btn:hover,.ghost-btn:hover,.danger-btn:hover{transform:translateY(-1px);opacity:0.95;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.primary-btn:disabled{opacity:.65;cursor:wait;transform:none;}

.portal-status{font-size:0.92rem;margin-top:10px;min-height:22px;font-weight:700;}
.portal-status.error{color:#b42318;}
.portal-status.success{color:#166534;}

.stars-input{display:flex;gap:4px;font-size:1.6rem;cursor:pointer;user-select:none;}
.stars-input span{color:#d1d5db;transition:color 0.15s,transform 0.15s;}
.stars-input span.on{color:var(--gold);}
.stars-input span:hover{transform:scale(1.15);}

/* Photo picker */
.photo-preview-row{display:none;align-items:center;gap:10px;margin-top:4px;}
.photo-preview-row img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 4px 12px rgba(13,27,64,.15);}
.field-hint{font-size:0.76rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;}

.testi-item{background:#fff;border:1px solid #e5e7eb;border-left:4px solid var(--gold);border-radius:14px;padding:16px 18px;margin-bottom:12px;transition:all 0.2s;}
.testi-item.inactive{border-left-color:#9ca3af;opacity:0.6;}
.testi-quote{font-size:0.93rem;color:var(--ink);line-height:1.65;margin:8px 0 10px;font-style:italic;}
.testi-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.testi-who{display:flex;align-items:center;gap:10px;}
.testi-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-weight:800;font-size:0.85rem;overflow:hidden;flex-shrink:0;}
.testi-avatar img{width:100%;height:100%;object-fit:cover;}
.testi-name{font-weight:700;color:var(--navy);font-size:0.92rem;}
.testi-stars{color:var(--gold);letter-spacing:2px;font-size:0.95rem;}
.testi-date{font-size:0.75rem;color:var(--muted);}
.testi-actions{display:flex;gap:8px;flex-wrap:wrap;}
.mini-btn{border:none;border-radius:8px;padding:7px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.mini-toggle{background:#eef4ff;color:var(--blue);}
.mini-delete{background:#fef2f2;color:#b42318;}
.mini-edit{background:#fef9ec;color:#92610e;}
.mini-remove-photo{background:#f3f4f6;color:#6b7280;}

.empty-box{padding:20px;border:1px dashed #d9e2ef;border-radius:14px;background:#fbfdff;color:#5d6e83;text-align:center;font-size:0.9rem;}
.count-pill{display:inline-block;background:#eef4ff;color:var(--blue);font-size:0.78rem;font-weight:700;padding:4px 12px;border-radius:999px;margin-left:8px;}

#logoutBtn{position:fixed;top:14px;right:16px;z-index:12000;border:1px solid #fecaca;border-radius:999px;padding:9px 18px;background:#fef2f2;color:#b42318;font:700 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(13,27,64,.12);}
</style>
<base target="_blank">
</head>
<body>
<button id="logoutBtn" type="button">🚪 Logout</button>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap" style="display:none">
  <div class="login-box">
    <h2>Admin Portal</h2>
    <p>Student Testimonials Manager</p>
    <div class="login-field"><label>Admin Email</label><input type="email" id="adminEmail" placeholder="admin@email.com"></div>
    <div class="login-field"><label>Password</label><input type="password" id="adminPassword" placeholder="••••••••"></div>
    <button class="login-btn" id="adminLoginBtn" type="button">Login as Admin</button>
    <div class="login-status" id="loginStatus"></div>
  </div>
</div>

<!-- APP -->
<div class="app-main hidden" id="appShell">
  <div class="app-topbar">
    <div>
      <h1 class="app-title">Testimonials</h1>
      <div class="app-sub">Add student reviews &amp; photos — they appear instantly on the website ⭐</div>
    </div>
    <button class="ghost-btn" id="closeBtn" type="button">← Dashboard</button>
  </div>

  <div class="app-grid-2">
    <!-- LEFT: Add form -->
    <div class="app-card">
      <h3 class="subject-title" id="formTitle">Add New Testimonial</h3>
      <div class="portal-field"><label>Student Name *</label><input type="text" id="tName" placeholder="e.g. Priya Sharma" maxlength="80"></div>
      <div class="portal-field"><label>Rating</label>
        <div class="stars-input" id="starsInput">
          <span data-v="1" class="on">★</span><span data-v="2" class="on">★</span><span data-v="3" class="on">★</span><span data-v="4" class="on">★</span><span data-v="5" class="on">★</span>
        </div>
      </div>
      <div class="portal-field">
        <label>Student Photo (optional)</label>
        <input type="file" id="tPhoto" accept="image/*">
        <div class="photo-preview-row" id="photoPreviewRow">
          <img id="photoPreviewImg" alt="preview">
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button class="mini-btn mini-remove-photo" id="photoRemoveBtn" type="button">Remove photo</button>
          </div>
        </div>
        <div class="field-hint" id="photoHint">JPG / PNG, up to 2 MB. Square photos look best.</div>
      </div>
      <div class="portal-field"><label>Testimonial *</label><textarea id="tQuote" placeholder="The student's actual words (get their permission first)" maxlength="700"></textarea></div>
      <div class="btn-row">
        <button class="primary-btn" id="saveBtn" type="button">💾 Publish Testimonial</button>
        <button class="ghost-btn hidden" id="cancelEditBtn" type="button">Cancel Edit</button>
      </div>
      <div class="portal-status" id="saveStatus"></div>
    </div>

    <!-- RIGHT: List -->
    <div class="app-card">
      <h3 class="subject-title">Live Testimonials <span class="count-pill" id="testiCount">0</span></h3>
      <div id="testiList"><div class="empty-box">Loading…</div></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
(function(){
  const ADMIN_EMAIL = 'vinayakproedu@gmail.com';
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();
  const MAX_PHOTO_BYTES = 2 * 1024 * 1024;

  function esc(v){ return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function val(id){ const n = document.getElementById(id); return n ? n.value.trim() : ''; }
  function setStatus(el,msg,err){ if(!el)return; el.textContent=msg; el.className='portal-status '+(err?'error':'success'); }
  function initials(name){ return String(name||'?').split(/\s+/).slice(0,2).map(x=>x.charAt(0).toUpperCase()).join(''); }
  function fmtDate(ts){ if(!ts||!ts.toDate)return ''; const d=ts.toDate(); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }

  /* ---------- Auth ---------- */
  document.getElementById('adminLoginBtn').addEventListener('click', async () => {
    const email = val('adminEmail'), pw = document.getElementById('adminPassword').value;
    if(!email || !pw){ setStatus(document.getElementById('loginStatus'),'Email and password required.',true); return; }
    try{
      const cred = await auth.signInWithEmailAndPassword(email, pw);
      if(cred.user.email !== ADMIN_EMAIL){ await auth.signOut(); setStatus(document.getElementById('loginStatus'),'Not authorized.',true); return; }
      localStorage.setItem('adminUnlocked','1');
      showApp();
    }catch(err){ setStatus(document.getElementById('loginStatus'), err.message, true); }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    localStorage.removeItem('adminUnlocked');
    await auth.signOut();
    location.reload();
  });

  document.getElementById('closeBtn').addEventListener('click', () => __vpToDash());

  auth.onAuthStateChanged(async user => {
    const lw = document.getElementById('loginWrap'), ap = document.getElementById('appShell');
    if(user && user.email === ADMIN_EMAIL){
      localStorage.setItem('adminUnlocked','1');
      lw.classList.add('hidden'); lw.style.display='none';
      ap.classList.remove('hidden');
      showApp();
    } else {
      if(user) await auth.signOut();
      localStorage.removeItem('adminUnlocked');
      ap.classList.add('hidden');
      lw.classList.remove('hidden'); lw.style.display='';
    }
  });

  function showApp(){ loadTestimonials(); }

  /* ---------- Photo picker ---------- */
  let photoFile = null;        // newly chosen file, not yet uploaded
  let existingPhotoURL = '';   // photo already saved on the doc being edited

  const photoInput = document.getElementById('tPhoto');
  const photoPreviewRow = document.getElementById('photoPreviewRow');
  const photoPreviewImg = document.getElementById('photoPreviewImg');
  const photoHint = document.getElementById('photoHint');

  function resetPhotoHint(){
    photoHint.style.color = '';
    photoHint.textContent = 'JPG / PNG, up to 2 MB. Square photos look best.';
  }
  function showPhotoPreview(url){
    photoPreviewImg.src = url;
    photoPreviewRow.style.display = 'flex';
    photoInput.style.display = 'none';
  }
  function clearPhoto(){
    photoFile = null;
    photoInput.value = '';
    photoInput.style.display = '';
    photoPreviewRow.style.display = 'none';
    photoPreviewImg.src = '';
    resetPhotoHint();
  }

  photoInput.addEventListener('change', () => {
    resetPhotoHint();
    const f = photoInput.files && photoInput.files[0];
    if(!f){ photoFile = null; return; }
    if(!/^image\//.test(f.type)){
      photoHint.style.color = '#b42318';
      photoHint.textContent = 'Please choose an image file (JPG or PNG).';
      photoInput.value = '';
      photoFile = null;
      return;
    }
    if(f.size > MAX_PHOTO_BYTES){
      photoHint.style.color = '#b42318';
      photoHint.textContent = 'Image is too large — maximum 2 MB. Try a smaller or compressed photo.';
      photoInput.value = '';
      photoFile = null;
      return;
    }
    photoFile = f;
    showPhotoPreview(URL.createObjectURL(f));
  });

  document.getElementById('photoRemoveBtn').addEventListener('click', () => {
    clearPhoto();
    existingPhotoURL = '';   // also removes the saved photo when updating
  });

  async function uploadPhoto(){
    const ext = (photoFile.name.split('.').pop() || 'jpg').toLowerCase();
    const safe = Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
    const ref = storage.ref('testimonials/' + safe);
    await ref.put(photoFile, { contentType: photoFile.type });
    return await ref.getDownloadURL();
  }

  /* ---------- Star rating input ---------- */
  let currentStars = 5;
  const starsBox = document.getElementById('starsInput');
  starsBox.querySelectorAll('span').forEach(s => {
    s.addEventListener('click', () => { currentStars = parseInt(s.dataset.v, 10); paintStars(); });
  });
  function paintStars(){
    starsBox.querySelectorAll('span').forEach(s => {
      s.classList.toggle('on', parseInt(s.dataset.v,10) <= currentStars);
    });
  }

  /* ---------- Add / Edit ---------- */
  let editingId = null;

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const name = val('tName'), quote = val('tQuote');
    if(!name || !quote){ setStatus(document.getElementById('saveStatus'),'Name and testimonial are required.',true); return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = photoFile ? '⏳ Uploading photo…' : '⏳ Saving…';
    try{
      let photoURL = existingPhotoURL || null;   // keep existing unless removed / replaced
      if(photoFile){
        photoURL = await uploadPhoto();
      }

      if(editingId){
        const upd = { name, quote, stars: currentStars };
        if(photoURL) upd.photoURL = photoURL;
        else upd.photoURL = firebase.firestore.FieldValue.delete();
        await db.collection('testimonials').doc(editingId).update(upd);
        setStatus(document.getElementById('saveStatus'),'Testimonial updated ✅');
      } else {
        const payload = {
          name, quote, stars: currentStars,
          active: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if(photoURL) payload.photoURL = photoURL;
        await db.collection('testimonials').add(payload);
        setStatus(document.getElementById('saveStatus'),'Testimonial published — live on the website ✅');
      }
      resetForm();
      await loadTestimonials();
    }catch(err){
      setStatus(document.getElementById('saveStatus'), err.message || 'Failed to save', true);
    }
    btn.disabled = false;
    btn.textContent = editingId ? '💾 Update Testimonial' : '💾 Publish Testimonial';
  });

  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  function resetForm(){
    editingId = null;
    clearPhoto();
    existingPhotoURL = '';
    document.getElementById('tName').value = '';
    document.getElementById('tQuote').value = '';
    currentStars = 5; paintStars();
    document.getElementById('formTitle').textContent = 'Add New Testimonial';
    document.getElementById('saveBtn').textContent = '💾 Publish Testimonial';
    document.getElementById('cancelEditBtn').classList.add('hidden');
    setStatus(document.getElementById('saveStatus'),'');
  }

  /* ---------- Load & render ---------- */
  async function loadTestimonials(){
    const snap = await db.collection('testimonials').orderBy('createdAt','desc').limit(100).get();
    const items = snap.docs.map(d => ({id:d.id, ...d.data()}));
    document.getElementById('testiCount').textContent = items.length;
    const box = document.getElementById('testiList');
    if(!items.length){ box.innerHTML = '<div class="empty-box">No testimonials yet. Add the first one on the left.</div>'; return; }

    box.innerHTML = items.map(t => `
      <div class="testi-item ${t.active ? '' : 'inactive'}">
        <div class="testi-meta">
          <div class="testi-who">
            <span class="testi-avatar">${
              t.photoURL
                ? `<img src="${esc(t.photoURL)}" alt="">`
                : esc(initials(t.name))
            }</span>
            <div>
              <div class="testi-name">${esc(t.name)}</div>
              <div class="testi-stars">${'★'.repeat(t.stars||5)}${'☆'.repeat(5-(t.stars||5))}</div>
            </div>
          </div>
          <span class="testi-date">${fmtDate(t.createdAt)} · ${t.active ? '🟢 LIVE' : '⚪ Hidden'}</span>
        </div>
        <div class="testi-quote">“${esc(t.quote)}”</div>
        <div class="testi-actions">
          <button class="mini-btn mini-edit" onclick="editTesti('${t.id}')">✏️ Edit</button>
          <button class="mini-btn mini-toggle" onclick="toggleTesti('${t.id}', ${t.active ? 'false' : 'true'})">${t.active ? '🙈 Hide from site' : '👁 Show on site'}</button>
          <button class="mini-btn mini-delete" onclick="deleteTesti('${t.id}')">🗑 Delete</button>
        </div>
      </div>`).join('');

    window.__testiCache = items;
  }

  window.editTesti = function(id){
    const t = (window.__testiCache||[]).find(x => x.id === id);
    if(!t) return;
    editingId = id;
    document.getElementById('tName').value = t.name || '';
    document.getElementById('tQuote').value = t.quote || '';
    currentStars = t.stars || 5; paintStars();
    existingPhotoURL = t.photoURL || '';
    clearPhoto();
    if(existingPhotoURL) showPhotoPreview(existingPhotoURL);
    document.getElementById('formTitle').textContent = 'Edit Testimonial';
    document.getElementById('saveBtn').textContent = '💾 Update Testimonial';
    document.getElementById('cancelEditBtn').classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  };

  window.toggleTesti = async function(id, makeActive){
    await db.collection('testimonials').doc(id).update({active: makeActive});
    await loadTestimonials();
  };

  window.deleteTesti = async function(id){
    if(!confirm('Delete this testimonial permanently?')) return;
    await db.collection('testimonials').doc(id).delete();
    await loadTestimonials();
  };
})();
</script>
<script>
/* Instant session restore */
(function(){
  try{
    if(localStorage.getItem('adminUnlocked')!=='1') return;
    var lw=document.getElementById('loginWrap'), ap=document.getElementById('appShell');
    if(lw){ lw.classList.add('hidden'); lw.style.display='none'; }
    if(ap) ap.classList.remove('hidden');
  }catch(e){}
})();
window.__vpToDash = function(){
  try{ if(window.self !== window.top){ parent.postMessage({type:'vp-close'}, '*'); return; } }catch(e){}
  location.href = 'index.html';
};
</script>
</body>
</html>
