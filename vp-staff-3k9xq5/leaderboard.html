<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Leaderboard | Faculty Portal</title>
<link rel="icon" type="image/png" href="https://pasteimg.com/images/2026/03/31/WhatsApp-Image-2026-03-19-at-6.49.19-PM.jpg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0D1B40">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B40;--blue:#1e3c72;--gold:#C9922A;--gold-lt:#E8AA48;--ink:#1A1A2E;--muted:#6B7280;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:#f5f7fb;line-height:1.65;}
.hidden{display:none !important;}
.login-wrap{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:min(420px,92vw);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:clamp(32px,6vw,48px);backdrop-filter:blur(20px);box-shadow:0 40px 100px rgba(0,0,0,.4);}
.login-box h2{color:#fff;font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:6px;text-align:center;}
.login-box>p{color:rgba(255,255,255,.55);font-size:.9rem;text-align:center;margin-bottom:28px;}
.lf{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.lf label{font-size:.74rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.65);}
.lf input,.lf select{padding:13px 16px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:10px;color:#fff;font-size:.95em;font-family:inherit;}
.lf input:focus,.lf select:focus{outline:none;border-color:rgba(201,146,42,.6);}
.lf select option{color:#111;}
.login-btn{width:100%;padding:15px;border-radius:50px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:var(--navy);font-size:1em;font-weight:700;font-family:inherit;}
.login-status{margin-top:12px;font-size:.9rem;font-weight:700;text-align:center;min-height:22px;color:#fca5a5;}
.forgot{text-align:center;margin-top:10px;}
.forgot a{color:var(--gold-lt);font-size:.85rem;cursor:pointer;font-weight:700;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:240px;background:var(--navy);color:#fff;padding:18px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand img{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;}
.brand h3{font-family:'Playfair Display',serif;font-size:1rem;}
.brand p{font-size:.68rem;letter-spacing:1.2px;text-transform:uppercase;color:rgba(232,170,72,.8);}
.menu a{display:block;padding:11px 14px;border-radius:10px;font-weight:600;font-size:.9rem;color:#fff;text-decoration:none;margin-bottom:4px;}
.menu a:hover,.menu a.active{background:var(--gold);color:var(--navy);}
.main{flex:1;padding:24px 28px;overflow:auto;}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(201,146,42,.25);}
h1{font-family:'Playfair Display',serif;color:var(--navy);font-size:1.5rem;}
.sub{color:var(--muted);font-size:.88rem;}
.card{background:#fff;border:1px solid rgba(201,146,42,.12);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(13,27,64,.06);margin-bottom:16px;}
.inp,select.inp,textarea.inp{width:100%;padding:11px 13px;border:1px solid #dbe2ee;border-radius:10px;font:inherit;font-size:.92rem;margin-top:6px;}
table{width:100%;border-collapse:collapse;font-size:.88rem;}
th,td{padding:9px 12px;border-bottom:1px solid #eef2f7;text-align:left;}
th{background:#f8fafc;color:var(--navy);font-size:.76rem;text-transform:uppercase;letter-spacing:.5px;}
.empty{padding:20px;border:1px dashed #d9e2ef;border-radius:14px;background:#fbfdff;color:#5d6e83;text-align:center;}
.chip{display:inline-block;background:#eef4ff;color:#1e3c72;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:800;margin:2px 4px 2px 0;}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:#111;}
.doubt-item{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:12px;background:#fff;}
@media(max-width:800px){.sidebar{width:100%;height:auto;}.app-shell{flex-direction:column;}}
</style>
<style>.app-shell{display:block !important;}.main{padding:56px 24px 40px !important;max-width:1100px;margin:0 auto;}</style></head>
<body>
<button onclick="(function(){try{if(window.self!==window.top){parent.postMessage({type:'vp-close'},'*');return;}}catch(e){}location.href='index.html';})()" style="position:fixed;top:12px;left:12px;z-index:15000;padding:8px 15px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;color:#0D1B40;font:700 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 3px 12px rgba(13,27,64,.12);">← Dashboard</button>
<button id="cornerLogout" onclick="(function(){try{localStorage.removeItem('vp_staff_sess');localStorage.removeItem('vp_staff_profile');}catch(e){}try{auth.signOut();}catch(e){}setTimeout(function(){location.href='index.html';},400);})()" style="position:fixed;top:12px;right:12px;z-index:15000;padding:8px 15px;border-radius:999px;background:#fef2f2;border:1px solid #fecaca;color:#b42318;font:700 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 3px 12px rgba(13,27,64,.12);">Logout ⏻</button>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h2>Faculty Portal</h2>
    <p>Leaderboard · Teachers only</p>
    <div class="lf"><label>Email</label><input type="email" id="lEmail" placeholder="you@gmail.com"></div>
    <div class="lf"><label>Password</label><input type="password" id="lPass" placeholder="••••••••"></div>
    <button class="login-btn" id="loginBtn" type="button">Login</button>
    <div class="login-status" id="lStatus"></div>
    <div class="forgot"><a onclick="resetPw()">Forgot password?</a></div>
  </div>
</div>
<div class="app-shell hidden" id="appShell">
  
  <main class="main">
    <div class="top"><div><h1>Leaderboard</h1><div class="sub" id="pageSub"></div></div></div>
    <div class="card"><strong style="color:var(--navy)">🏆 Rankings — your subjects</strong> <span style="font-size:.8rem;color:var(--muted)">(auto-loaded)</span><div id="lbBox" style="margin-top:10px;"><div class="empty">Loading…</div></div></div>
  </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = v => { if(!v) return ''; const d = v.toDate ? v.toDate() : new Date(v.seconds ? v.seconds*1000 : v); return d.toLocaleString('en-IN'); };
const subTag = () => 'Subjects: ' + (window.__subs||[]).join(', ') + ' · Batches: ' + ((window.__batches||[]).join(', ') || 'all');
const inMyBatches = l => { const tb = window.__batches||[]; if(!tb.length) return true; const b = l.batchCodes||[]; return !b.length || b.some(x => tb.includes(x)); };

try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch(e) {}
document.getElementById('loginBtn').onclick = () => {
  auth.signInWithEmailAndPassword(document.getElementById('lEmail').value.trim(), document.getElementById('lPass').value).catch(e => { document.getElementById('lStatus').textContent = e.message; });
};
window.resetPw = function(){
  const e = (document.getElementById('lEmail').value || '').trim() || prompt('Enter your email:');
  if(!e) return;
  auth.sendPasswordResetEmail(e.trim()).then(()=>{ const s=document.getElementById('lStatus'); s.textContent='Reset email sent.'; s.style.color='#a7f3d0'; }).catch(err=>{ document.getElementById('lStatus').textContent = err.message; });
};
/* Optimistic session: if this device recently had a teacher session, hide the login instantly and verify in background */
try{
  if(localStorage.getItem('vp_staff_sess')){
    document.getElementById('loginWrap').style.display = 'none';
    var __app = document.getElementById('appShell'); if(__app) __app.classList.remove('hidden');
    var __prof = JSON.parse(localStorage.getItem('vp_staff_profile') || 'null');
    if(__prof){ window.__subs = __prof.subs || []; window.__batches = __prof.batches || []; }
    window.addEventListener('DOMContentLoaded', function(){
      if(__prof && typeof loadAll === 'function'){ try{ loadAll(); }catch(err){} }
    });
  }
}catch(e){}
auth.onAuthStateChanged(async user => {
  if(!user){
    localStorage.removeItem('vp_staff_sess'); localStorage.removeItem('vp_staff_profile');
    const lw = document.getElementById('loginWrap');
    lw.style.display = ''; lw.classList.remove('hidden');
    document.getElementById('appShell').classList.add('hidden');
    return;
  }
  try{
    const tq = await db.collection('users').where('email','==',user.email).limit(1).get();
    const tdoc = tq.empty ? null : tq.docs[0];
    if(tdoc && tdoc.data().role === 'teacher'){
      window.__subs = tdoc.data().assignedSubjects || [];
      window.__batches = tdoc.data().assignedBatches || [];
      localStorage.setItem('vp_staff_sess', user.email);
      try{ localStorage.setItem('vp_staff_profile', JSON.stringify({subs: window.__subs||[], batches: window.__batches||[]})); }catch(e){}
      document.getElementById('loginWrap').classList.add('hidden');
      document.getElementById('appShell').classList.remove('hidden');
      loadAll();
      return;
    }
  }catch(e){}
  await auth.signOut();
  document.getElementById('loginWrap').style.display = '';
  const s = document.getElementById('lStatus'); s.textContent = 'Teacher accounts only.';
});

async function loadAll(){
  document.getElementById('pageSub').textContent = subTag();
  const subs = window.__subs||[];
  try{
    const snap = await db.collection('attempts').orderBy('createdAt','desc').limit(500).get();
    const all = snap.docs.map(d=>d.data()).filter(a => subs.includes(a.subject));
    const stats = {};
    all.forEach(a => {
      const k = a.userId || 'x';
      if(!stats[k]) stats[k] = { name: a.userName || 'Student', scores: [], count: 0 };
      stats[k].scores.push(Number(a.percentage||0)); stats[k].count++;
    });
    const rows = Object.values(stats).map(s => ({ name: s.name, count: s.count, avg: s.scores.length ? Math.round(s.scores.reduce((x,y)=>x+y,0)/s.scores.length) : 0 })).sort((a,b)=>b.avg-a.avg);
    const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    document.getElementById('lbBox').innerHTML = rows.length ? '<table><tr><th>Rank</th><th>Student</th><th>Tests</th><th>Avg</th></tr>' + rows.map((r,i)=>'<tr><td style="font-weight:800;color:'+(i<3?'#C9922A':'#6b7280')+';">'+medal(i)+' '+(i+1)+'</td><td><strong>'+esc(r.name)+'</strong></td><td>'+r.count+'</td><td style="font-weight:700;">'+r.avg+'%</td></tr>').join('') + '</table>' : '<div class="empty">No test attempts in your subjects yet.</div>';
  }catch(e){ document.getElementById('lbBox').innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
</script>
<script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    var dir = location.href.replace(/[^/]*$/, '');
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ if(r.scope !== dir){ r.unregister(); } });
    });
    caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
    navigator.serviceWorker.register('./staff-sw.js', {scope:'./'}).catch(function(){});
  });
}
(function(){
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; showBtn(); });
  function showBtn(){
    if (document.getElementById('vpInstallBtn')) return;
    var b = document.createElement('button');
    b.id = 'vpInstallBtn'; b.textContent = '📲 Install App';
    b.style.cssText = "position:fixed;left:18px;bottom:18px;z-index:15000;border:none;border-radius:999px;padding:12px 20px;background:linear-gradient(135deg,#C9922A,#E8AA48);color:#0D1B40;font:800 14px 'DM Sans',sans-serif;box-shadow:0 10px 28px rgba(13,27,64,.35);cursor:pointer;";
    b.onclick = function(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; } b.remove(); };
    document.body.appendChild(b);
  }
})();
</script>
</body>
</html>
