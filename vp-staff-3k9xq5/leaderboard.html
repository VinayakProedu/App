<style>
:root{
  --navy:#0D1B40; --navy-mid:#1a2e5e; --blue:#1e3c72; --gold:#C9922A; --gold-lt:#E8AA48;
  --amber:#F5C04A; --ink:#1A1A2E; --muted:#6B7280; --smoke:#EFF1F6; --white:#FFFFFF;
  --shadow-sm:0 4px 20px rgba(13,27,64,0.08); --shadow-md:0 12px 45px rgba(13,27,64,0.14);
  --r-sm:10px; --r-md:16px; --r-lg:24px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;font-size:16px;}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:#f5f7fb;line-height:1.65;overflow-x:hidden;}
img{max-width:100%;display:block;}
a{text-decoration:none;color:inherit;}
h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.2;}

/* Login */
.login-wrap{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{width:min(420px,92vw);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--r-lg);padding:clamp(32px,6vw,48px);backdrop-filter:blur(20px);box-shadow:0 40px 100px rgba(0,0,0,0.4);}
.login-box h2{font-family:'Playfair Display',serif;color:#fff;font-size:1.6rem;margin-bottom:6px;text-align:center;}
.login-box p{color:rgba(255,255,255,0.55);font-size:0.9rem;text-align:center;margin-bottom:28px;}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-field label{font-size:0.74rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.65);}
.login-field input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.14);border-radius:var(--r-sm);color:#fff;font-size:0.95em;font-family:'DM Sans',sans-serif;transition:all 0.25s;}
.login-field input::placeholder{color:rgba(255,255,255,0.32);}
.login-field input:focus{outline:none;border-color:rgba(201,146,42,0.6);background:rgba(255,255,255,0.13);box-shadow:0 0 0 3px rgba(201,146,42,0.15);}
.login-btn{width:100%;padding:15px;border-radius:50px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:var(--navy);font-size:1em;font-weight:700;font-family:'DM Sans',sans-serif;box-shadow:0 8px 28px rgba(201,146,42,0.35);transition:all 0.3s;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(201,146,42,0.5);}
.login-status{margin-top:12px;font-size:0.9rem;font-weight:700;text-align:center;min-height:22px;}
.login-status.error{color:#fca5a5;}

/* App Shell */
.app-shell{display:flex;width:100%;min-height:100vh;}
.app-sidebar{width:260px;background:var(--navy);color:#fff;padding:18px;overflow:auto;flex-shrink:0;position:fixed;height:100vh;left:0;top:0;z-index:100;}
.app-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.08);}
.app-brand img{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;}
.app-brand h3{font-family:'Playfair Display',serif;font-size:1.05rem;margin:0;color:#fff;}
.app-brand p{font-size:0.72rem;letter-spacing:1.4px;text-transform:uppercase;color:rgba(232,170,72,0.8);margin-top:2px;}
.app-menu{display:grid;gap:6px;}
.app-menu a,.app-menu button{width:100%;border:none;background:transparent;color:#fff;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:left;font-weight:600;font-size:0.9rem;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:10px;transition:all 0.2s;text-decoration:none;}
.app-menu a:hover,.app-menu button:hover,.app-menu a.active,.app-menu button.active{background:var(--gold);color:var(--navy);}
.app-main{flex:1;margin-left:260px;padding:24px 28px;overflow:auto;min-height:100vh;}

/* Topbar */
.app-topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e5e7eb;}
.app-title{font-family:'Playfair Display',serif;color:var(--navy);font-size:1.6rem;margin:0;}
.app-sub{color:var(--muted);font-size:0.9rem;}

/* Cards */
.app-card{background:#fff;border:1px solid rgba(201,146,42,0.12);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.subject-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--navy);margin:0 0 14px;}

/* Buttons */
.primary-btn,.secondary-btn,.ghost-btn,.back-btn{border:none;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.9rem;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;}
.primary-btn{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;}
.secondary-btn{background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:var(--navy);}
.ghost-btn{background:#eef4ff;color:var(--blue);}
.back-btn{background:#f1f5f9;color:var(--navy);margin-bottom:16px;}
.primary-btn:hover,.secondary-btn:hover,.ghost-btn:hover,.back-btn:hover{transform:translateY(-1px);opacity:0.95;}

/* Status */
.portal-status{font-size:0.92rem;margin-top:10px;min-height:22px;font-weight:700;}
.portal-status.error{color:#b42318;}

/* Batch filter bar */
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.filter-bar select{padding:10px 14px;border-radius:10px;border:1px solid #d7ddea;background:#fff;font:inherit;color:var(--ink);min-width:200px;}
.filter-bar select:focus{outline:3px solid rgba(201,146,42,0.22);border-color:var(--gold);}

/* Leaderboard */
.leaderboard-wrap{max-width:720px;margin:0 auto;}
.leaderboard-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eef2f7;}
.leaderboard-row:last-child{border-bottom:none;}
.leaderboard-row.top-1{background:linear-gradient(90deg,rgba(201,146,42,0.08),transparent);margin:0 -12px;padding:14px 12px;border-radius:12px;border-bottom:none;margin-bottom:8px;}
.leaderboard-row.top-2{background:linear-gradient(90deg,rgba(156,163,175,0.08),transparent);margin:0 -12px;padding:14px 12px;border-radius:12px;border-bottom:none;margin-bottom:8px;}
.leaderboard-row.top-3{background:linear-gradient(90deg,rgba(180,83,9,0.06),transparent);margin:0 -12px;padding:14px 12px;border-radius:12px;border-bottom:none;margin-bottom:8px;}
.rank-badge{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:0.85rem;font-weight:800;flex-shrink:0;}
.rank-badge.gold{background:linear-gradient(135deg,var(--gold),var(--gold-lt));color:var(--navy);box-shadow:0 4px 12px rgba(201,146,42,0.3);}
.rank-badge.silver{background:linear-gradient(135deg,#9ca3af,#d1d5db);color:#fff;box-shadow:0 4px 12px rgba(156,163,175,0.3);}
.rank-badge.bronze{background:linear-gradient(135deg,#b45309,#d97706);color:#fff;box-shadow:0 4px 12px rgba(180,83,9,0.3);}
.lb-name{font-weight:700;color:var(--navy);font-size:0.95rem;}
.lb-meta{color:var(--muted);font-size:0.8rem;}
.lb-score{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:800;color:var(--navy);}
.lb-score span{font-size:0.75rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:500;}

/* Metric bar */
.metric-bar{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.metric-bar h3{margin:0;font-family:'Playfair Display',serif;font-size:1.2rem;}
.metric-bar .stat{color:rgba(255,255,255,0.7);font-size:0.85rem;}

/* Empty */
.empty-box{padding:20px;border:1px dashed #d9e2ef;border-radius:14px;background:#fbfdff;color:#5d6e83;text-align:center;font-size:0.9rem;}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(13,27,64,0.2);border-radius:10px;}

/* Responsive */
@media(max-width:900px){
  .app-sidebar{width:100%;height:auto;position:relative;}
  .app-main{margin-left:0;}
  .app-shell{flex-direction:column;}
}
@media(max-width:640px){
  .app-main{padding:16px;}
}
.hidden{display:none !important;}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>

<script>
(function(){
  const ADMIN_EMAIL = "vinayakproedu@gmail.com";

  
  const auth = firebase.auth();
  const db = firebase.firestore();

  function esc(v){ return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function val(id){ const n = document.getElementById(id); return n ? n.value.trim() : ''; }
  function setStatus(el, msg, err=false){ if(!el) return; el.textContent = msg; el.className = 'portal-status ' + (err ? 'error' : 'success'); }

  /* Auth */
  document.getElementById('adminLoginBtn').addEventListener('click', async () => {
    const email = val('adminEmail');
    const pw = document.getElementById('adminPassword').value;
    if(!email || !pw){ setStatus(document.getElementById('loginStatus'), 'Email and password required.', true); return; }
    try{
      const cred = await auth.signInWithEmailAndPassword(email, pw);
      /* role verified in onAuthStateChanged */
      localStorage.setItem('adminUnlocked', '1');
      showApp();
    }catch(err){ setStatus(document.getElementById('loginStatus'), err.message, true); }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    localStorage.removeItem('adminUnlocked');
    await auth.signOut();
    location.reload();
  });

  document.getElementById('closeBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  auth.onAuthStateChanged(async user => {
    if(!user){
      document.getElementById('loginWrap').classList.remove('hidden');
      document.getElementById('appShell').classList.add('hidden');
      return;
    }
    try{
      const tq = await db.collection('users').where('email','==',user.email).limit(1).get();
      const tdoc = tq.empty ? null : tq.docs[0];
      if(tdoc && tdoc.data().role === 'teacher'){
        window.__isTeacher = true;
        window.__teacherSubjects = tdoc.data().assignedSubjects || [];
        showApp();
        return;
      }
    }catch(e){}
    await auth.signOut();
    document.getElementById('loginStatus').textContent = 'Teacher accounts only. Admin uses the main panel.';
    document.getElementById('loginStatus').className = 'login-status error';
    document.getElementById('loginWrap').classList.remove('hidden');
    document.getElementById('appShell').classList.add('hidden');
  });

  function showApp(){
    document.getElementById('loginWrap').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
    loadBatches();
  }

  /* Batches */
 async function loadBatches(){
    try {
        const snap = await db.collection('batches').orderBy('createdAt','desc').get().catch(()=>null);
        const batches = snap ? snap.docs.map(d => d.data()) : [];
        const sel = document.getElementById('batchSelect'); // FIXED: was batchFilter
        if(!sel) return;
        const current = sel.value;
        sel.innerHTML = '<option value="">-- Choose Batch --</option>' + 
            batches.map(b => `<option value="${esc(b.code)}">${esc(b.code)} - ${esc(b.name)}</option>`).join('');
        if(current && batches.some(b => b.code === current)) sel.value = current;
    } catch(err) {
        console.error('loadBatches failed', err);
    }
}

  window.onBatchChange = function(){
    document.getElementById('leaderboardView').style.display = 'none';
  };

  window.loadLeaderboard = async function(){
    const subs = window.__teacherSubjects || [];
    if(window.__isTeacher){
      // Teacher path: rank students directly from subject attempts — no batch/student-list query
      document.getElementById('lbBatchName').textContent = 'Subjects: ' + (subs.join(', ') || 'none');
      document.getElementById('lbBatchStat').textContent = 'Faculty view';
      const tbody = document.getElementById('lbTableBodyX') || document.getElementById('lbTableBody');
      const podium = document.getElementById('lbPodiumX') || document.getElementById('lbPodium');
      if(tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;">Loading…</td></tr>';
      try{
        const attemptSnap = await db.collection('attempts').orderBy('createdAt','desc').limit(500).get();
        let all = attemptSnap.docs.map(d => d.data()).filter(a => subs.includes(a.subject));
        const stats = {};
        all.forEach(a => {
          const key = a.userId || 'unknown';
          if(!stats[key]) stats[key] = { name: a.userName || 'Student', scores: [], best: 0, count: 0 };
          stats[key].scores.push(Number(a.percentage || 0));
          stats[key].best = Math.max(stats[key].best, Number(a.percentage || 0));
          stats[key].count++;
        });
        renderRows(Object.entries(stats).map(([uid,s]) => ({ uid, name:s.name, count:s.count, avg: s.scores.length ? Math.round(s.scores.reduce((x,y)=>x+y,0)/s.scores.length) : 0, best: s.best })));
      }catch(e){
        if(tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:#b42318;">' + esc(e.message) + '</td></tr>';
      }
      return;
    }
    /* ---- admin path (unchanged) ---- */
    const batchCode = document.getElementById('batchSelect').value;
    if(!batchCode){ document.getElementById('batchStatus').textContent = 'Select a batch first.'; document.getElementById('batchStatus').className = 'portal-status error'; return; }
    document.getElementById('batchStatus').textContent = 'Loading...';
    document.getElementById('batchStatus').className = 'portal-status';
    document.getElementById('leaderboardView').style.display = 'block';
    document.getElementById('lbBatchName').textContent = batchCode;
    const list = document.getElementById('leaderboardList');
    if(list) list.innerHTML = '<div class="empty-box">Loading leaderboard...</div>';
    try{
      const userSnap = await db.collection('users').where('role','==','student').where('batchCode','==',batchCode).limit(200).get();
      const studentIds = userSnap.docs.map(d => d.id);
      if(!studentIds.length){ if(list) list.innerHTML = '<div class="empty-box">No students in this batch.</div>'; document.getElementById('lbBatchStat').textContent = '0 students'; document.getElementById('batchStatus').textContent=''; return; }
      const attemptSnap = await db.collection('attempts').orderBy('createdAt','desc').limit(500).get();
      let allAttempts = attemptSnap.docs.map(d => d.data());
      if(window.__isTeacher){ const s2 = window.__teacherSubjects || []; allAttempts = allAttempts.filter(a => s2.includes(a.subject)); }
      const batchAttempts = allAttempts.filter(a => studentIds.includes(a.userId));
      const ranking = {};
      batchAttempts.forEach(a => {
        const key = a.userId;
        if(!ranking[key]) ranking[key] = { name: a.userName || 'Student', score: 0, total: 0, attempts: 0 };
        ranking[key].score += Number(a.score || 0);
        ranking[key].total += Number(a.total || 0);
        ranking[key].attempts++;
      });
      renderRows(Object.values(ranking).map(r => ({ name: r.name, count: r.attempts, avg: r.total ? Math.round((r.score/r.total)*100) : 0, best: r.total ? Math.round((r.score/r.total)*100) : 0 })));
      document.getElementById('lbBatchStat').textContent = studentIds.length + ' students · ' + batchAttempts.length + ' attempts';
      document.getElementById('batchStatus').textContent = '';
    }catch(err){
      if(list) list.innerHTML = '<div class="empty-box">Error: ' + esc(err.message) + '</div>';
      document.getElementById('batchStatus').textContent = err.message;
      document.getElementById('batchStatus').className = 'portal-status error';
    }
  };
  function renderRows(rows){
    rows.sort((a,b) => b.avg - a.avg || b.best - a.best);
    const tbody = document.getElementById('lbTableBodyX') || document.getElementById('lbTableBody');
    const podium = document.getElementById('lbPodiumX') || document.getElementById('lbPodium');
    const list = document.getElementById('leaderboardList');
    if(!rows.length){
      if(tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;">No test data yet for your subjects.</td></tr>';
      if(podium) podium.innerHTML = '';
      if(list) list.innerHTML = '<div class="empty-box">No attempts yet.</div>';
      return;
    }
    const medal = i => i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : '';
    if(tbody) tbody.innerHTML = rows.map((r,i) => '<tr><td style="padding:14px;font-weight:800;color:'+(i<3?'#C9922A':'#6b7280')+';">'+medal(i)+' #'+(i+1)+'</td><td style="padding:14px;"><strong>'+esc(r.name)+'</strong></td><td style="padding:14px;">'+r.count+'</td><td style="padding:14px;font-weight:700;">'+r.avg+'%</td><td style="padding:14px;">'+r.best+'%</td></tr>').join('');
    if(list) list.innerHTML = rows.slice(0,10).map((r,i) => '<div class="leaderboard-row '+(i===0?'top-1':i===1?'top-2':i===2?'top-3':'')+'"><div style="display:flex;gap:12px;align-items:center;"><span class="rank-badge">'+medal(i)+(i+1)+'</span><div><div class="lb-name">'+esc(r.name)+'</div><div class="lb-meta">'+r.count+' attempt(s)</div></div></div><div class="lb-score">'+r.avg+'<span>%</span></div></div>').join('');
    if(podium) podium.innerHTML = '';
  };
})();
</script>
<script>
if (top !== self) { top.location = self.location; }
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('../sw.js').catch(function(e){ console.warn('SW:', e); });
  });

/* One-tap PWA install button */
(function(){
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt = e; showBtn();
  });
  function showBtn(){
    if (document.getElementById('vpInstallBtn')) return;
    var b = document.createElement('button');
    b.id = 'vpInstallBtn';
    b.textContent = '📲 Install App';
    b.style.cssText = "position:fixed;left:18px;bottom:18px;z-index:15000;border:none;border-radius:999px;padding:12px 20px;background:linear-gradient(135deg,#C9922A,#E8AA48);color:#0D1B40;font:800 14px 'DM Sans',sans-serif;box-shadow:0 10px 28px rgba(13,27,64,.35);cursor:pointer;";
    b.onclick = function(){
      if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
      b.remove();
    };
    document.body.appendChild(b);
  }
  window.__vpShowInstall = showBtn;
  /* If already installed, the prompt never fires - hide nothing, just don't show */
})();
</script>
<script>
/* Skip login flash for returning admin (auth will re-verify and correct if needed) */
(function(){
  try{
    var ok = localStorage.getItem('adminUnlocked') === '1' || sessionStorage.getItem('adminUnlocked') === '1';
    if(!ok) return;
    var loginEl = document.getElementById('loginWrap') || document.getElementById('loginScreen');
    var appEl = document.getElementById('appShell') || document.getElementById('adminApp');
    if(loginEl){ loginEl.style.display = 'none'; loginEl.classList.add('hidden'); }
    if(appEl){ appEl.classList.remove('hidden'); appEl.style.display = ''; }
  }catch(e){}
})();
</script>
</body>
